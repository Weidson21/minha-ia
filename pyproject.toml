[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minha-ia"
version = "0.1.0"
description = "Projeto modular para desenvolvimento e avaliacao de modelos proprios de inteligencia artificial"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]